parameters:
- name: envDir      # directory for the environment's Terraform configuration
  type: string

steps:
- checkout: self

- script: terraform init -reconfigure
  displayName: 'Terraform Init (${{ parameters.envDir }})'
  workingDirectory: envs/${{ parameters.envDir }}

- script: terraform validate
  displayName: 'Terraform Validate (${{ parameters.envDir }})'
  workingDirectory: envs/${{ parameters.envDir }}

- script: terraform plan -var-file=/home/ubuntu/tfvars/${{ parameters.envDir }}.tfvars -out=tfplan
  displayName: 'Terraform Plan (${{ parameters.envDir }})'
  workingDirectory: envs/${{ parameters.envDir }}

- publish: $(System.DefaultWorkingDirectory)/envs/${{ parameters.envDir }}/tfplan
  artifact: tfplan-${{ parameters.envDir }}
  displayName: 'Publish plan (${{ parameters.envDir }})'
