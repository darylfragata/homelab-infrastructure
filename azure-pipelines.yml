trigger:
  branches:
    include:
    - release/*

pool:
  name: AWS-Agents   # self-hosted agent pool (matches azp_pool in tfvars)

stages:
- stage: Dev
  displayName: 'Terraform - Dev'
  jobs:
  - job: TerraformDev
    variables:
    - group: dev
    steps:
    - template: templates/terraform-steps.yml
      parameters:
        environment: $(environment)
        backendConfig: $(backendConfig)
        tfvarsUri: $(tfvarsUriDev)

- stage: Prod
  displayName: 'Terraform - Prod'
  dependsOn: Dev
  condition: succeeded()
  jobs:
  - deployment: TerraformProd
    environment: prod   # ADO Environment - approval gate configured in Library UI, not here
    variables:
    - group: prod
    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/terraform-steps.yml
            parameters:
              environment: $(environment)
              backendConfig: $(backendConfig)
              tfvarsUri: $(tfvarsUriProd)
