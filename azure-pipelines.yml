trigger:
  branches:
    include:
    - release/*

pool:
  name: AWS-Agents   # self-hosted agent pool (matches azp_pool in tfvars)

stages:
- stage: Dev
  displayName: 'Terraform - Dev'
  jobs:
  - job: PlanDev
    displayName: 'Plan (dev)'
    variables:
    - group: dev
    steps:
    - template: templates/terraform-plan-steps.yml
      parameters:
        environment: dev
        tfvarsUri: $(tfvarsUriDev)

  - deployment: ApplyDev
    displayName: 'Apply (dev)'
    dependsOn: PlanDev
    environment: dev-apply   # ADO Environment - approval gate configured in Library UI, not here
    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/terraform-apply-steps.yml
            parameters:
              environment: dev

- stage: Prod
  displayName: 'Terraform - Prod'
  dependsOn: Dev
  condition: succeeded()
  jobs:
  - job: PlanProd
    displayName: 'Plan (prod)'
    variables:
    - group: prod
    steps:
    - template: templates/terraform-plan-steps.yml
      parameters:
        environment: prod
        tfvarsUri: $(tfvarsUriProd)

  - deployment: ApplyProd
    displayName: 'Apply (prod)'
    dependsOn: PlanProd
    environment: prod   # ADO Environment - approval gate configured in Library UI, not here
    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/terraform-apply-steps.yml
            parameters:
              environment: prod
