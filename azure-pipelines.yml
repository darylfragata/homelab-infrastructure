trigger:
  branches:
    include:
      - release/*

pool:
  name: AWS-Agents # self-hosted agent pool (matches azp_pool in tfvars)

stages:
  - stage: Build
    displayName: "Build (lambda)"
    dependsOn: [] # explicit - no dependency, runs first automatically
    jobs:
      - job: BuildLambda
        displayName: "Build Lambda artifact"
        steps:
          - script: echo "placeholder - would package Lambda code into lambda-artifact.zip"
            displayName: "Package Lambda artifact [placeholder]"

          - script: echo "placeholder - would upload lambda-artifact.zip to S3"
            displayName: "Upload artifact to S3 [placeholder]"

  - stage: DevPlan
    displayName: "Plan (dev)"
    dependsOn: Build # placeholder - Dev now waits on the Lambda artifact being built/uploaded first
    jobs:
      - job: DevPlan
        displayName: "Plan (dev)"
        variables:
          - group: dev # ADO Library variable group - supplies infra_env and tfvarsUri
        steps:
          - script: echo "would reference Lambda artifact at s3://REPLACE-ME-lambda-artifacts-bucket/lambda/$(Build.BuildId)/lambda-artifact.zip [placeholder]"
            displayName: "Use Lambda artifact [placeholder]"

          - template: templates/terraform-plan-steps.yml
            parameters:
              envDir: $(infra_env) # from ADO Library variable group
              tfvarsS3Uri: $(tfvarsUri) # from ADO Library variable group

  - stage: DevApply
    displayName: "Apply (dev)"
    dependsOn: DevPlan
    jobs:
      - deployment: DevApply
        displayName: "Apply (dev)"
        variables:
          - group: dev # ADO Library variable group - supplies infra_env
        environment: dev-deployment # ADO Environment - approval gate configured in Library UI, not here
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/terraform-apply-steps.yml
                  parameters:
                    envDir: $(infra_env) # from ADO Library variable group

  - stage: ProdPlan
    displayName: "Plan (prod)"
    dependsOn: Build # placeholder - Prod now waits on the Lambda artifact being built/uploaded first (still independent of Dev)
    jobs:
      - job: ProdPlan
        displayName: "Plan (prod)"
        variables:
          - group: prod # ADO Library variable group - supplies infra_env and tfvarsUri
        steps:
          - script: echo "would reference Lambda artifact at s3://REPLACE-ME-lambda-artifacts-bucket/lambda/$(Build.BuildId)/lambda-artifact.zip [placeholder]"
            displayName: "Use Lambda artifact [placeholder]"

          - template: templates/terraform-plan-steps.yml
            parameters:
              envDir: $(infra_env) # from ADO Library variable group
              tfvarsS3Uri: $(tfvarsUri) # from ADO Library variable group

  - stage: ProdApply
    displayName: "Apply (prod)"
    dependsOn: ProdPlan
    jobs:
      - deployment: ProdApply
        displayName: "Apply (prod)"
        variables:
          - group: prod # ADO Library variable group - supplies infra_env
        environment: prod-deployment # ADO Environment - approval gate configured in Library UI, not here
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/terraform-apply-steps.yml
                  parameters:
                    envDir: $(infra_env) # from ADO Library variable group
