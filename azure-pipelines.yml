trigger:
  branches:
    include:
      - release/*

pool:
  name: AWS-Agents # self-hosted agent pool (matches azp_pool in tfvars)

stages:
  - stage: PlanDev
    displayName: "Plan (dev)"
    jobs:
      - job: PlanDev
        displayName: "Plan (dev)"
        variables:
          - group: dev # ADO Library variable group - supplies infra_env and tfvarsUri
        steps:
          - template: templates/terraform-plan-steps.yml
            parameters:
              envDir: $(infra_env) # from ADO Library variable group
              tfvarsS3Uri: $(tfvarsUri) # from ADO Library variable group

  - stage: ApplyDev
    displayName: "Apply (dev)"
    dependsOn: PlanDev
    condition: succeeded()
    jobs:
      - deployment: ApplyDev
        displayName: "Apply (dev)"
        variables:
          - group: dev # ADO Library variable group - supplies infra_env
        environment: dev-deployment # ADO Environment - approval gate configured in Library UI, not here
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/terraform-apply-steps.yml
                  parameters:
                    envDir: $(infra_env) # from ADO Library variable group

  - stage: PlanProd
    displayName: "Plan (prod)"
    dependsOn: ApplyDev
    condition: succeeded()
    jobs:
      - job: PlanProd
        displayName: "Plan (prod)"
        variables:
          - group: prod # ADO Library variable group - supplies infra_env and tfvarsUri
        steps:
          - template: templates/terraform-plan-steps.yml
            parameters:
              envDir: $(infra_env) # from ADO Library variable group
              tfvarsS3Uri: $(tfvarsUri) # from ADO Library variable group

  - stage: ApplyProd
    displayName: "Apply (prod)"
    dependsOn: PlanProd
    condition: succeeded()
    jobs:
      - deployment: ApplyProd
        displayName: "Apply (prod)"
        variables:
          - group: prod # ADO Library variable group - supplies infra_env
        environment: prod-deployment # ADO Environment - approval gate configured in Library UI, not here
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/terraform-apply-steps.yml
                  parameters:
                    envDir: $(infra_env) # from ADO Library variable group
