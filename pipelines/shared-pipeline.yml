trigger:
  branches:
    include:
      - develop

pool:
  name: AWS-Agents   # self-hosted agent pool - this pipeline manages that very agent, see envs/shared

stages:
  - stage: SharedPlan
    displayName: "Plan (shared)"
    dependsOn: [] # explicit - no dependency, runs automatically on every trigger
    jobs:
      - job: SharedPlan
        displayName: "Plan (shared)"
        variables:
          - group: shared # ADO Library variable group - supplies infra_env and tfvarsUri
        steps:
          - template: /templates/terraform-plan-steps.yml
            parameters:
              envDir: $(infra_env) # from ADO Library variable group

  - stage: SharedApply
    displayName: "Apply (shared)"
    dependsOn: SharedPlan
    jobs:
      - deployment: SharedApply
        displayName: "Apply (shared)"
        variables:
          - group: shared # ADO Library variable group - supplies infra_env
        environment: shared-deployment # ADO Environment - approval gate configured in Library UI, not here
        strategy:
          runOnce:
            deploy:
              steps:
                - template: /templates/terraform-apply-steps.yml
                  parameters:
                    envDir: $(infra_env) # from ADO Library variable group

