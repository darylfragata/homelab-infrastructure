trigger:
  branches:
    include:
      - develop

pr: none # this pipeline runs terraform apply against real AWS resources - never trigger it from a PR

pool:
  name: AWS-Agents # self-hosted agent pool (matches azp_pool in tfvars) - the Shared stages below manage the very agent this pipeline runs on (see envs/shared); its first-ever apply must run locally, not through this pipeline

variables:
  TERRAFORM_VERSION: '1.7.5' # matches provider.tf's required_version >= 1.7.0 - bump as needed
  TFLINT_VERSION: '0.53.0' # bump as needed - https://github.com/terraform-linters/tflint/releases
  CHECKOV_VERSION: '3.2.257' # bump as needed - https://github.com/bridgecrewio/checkov/releases

stages:
  - stage: Validate
    displayName: "Validate"
    jobs:
      - job: Validate
        displayName: "Validate"
        steps:
          - checkout: self

          - script: |
              set -e
              TF_DIR=$(Agent.ToolsDirectory)/terraform/$(TERRAFORM_VERSION)
              mkdir -p "$TF_DIR"
              curl -sSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/$(TERRAFORM_VERSION)/terraform_$(TERRAFORM_VERSION)_linux_amd64.zip
              unzip -o -q /tmp/terraform.zip -d "$TF_DIR"
              chmod +x "$TF_DIR/terraform"
              echo "##vso[task.prependpath]$TF_DIR"
            displayName: 'Install Terraform $(TERRAFORM_VERSION)'

          - script: terraform fmt -check -recursive
            displayName: 'Terraform Fmt Check'

          - script: terraform init -backend=false
            displayName: 'Terraform Init (dev)'
            workingDirectory: envs/dev

          - script: terraform validate
            displayName: 'Terraform Validate (dev)'
            workingDirectory: envs/dev

          - script: terraform init -backend=false
            displayName: 'Terraform Init (prod)'
            workingDirectory: envs/prod

          - script: terraform validate
            displayName: 'Terraform Validate (prod)'
            workingDirectory: envs/prod

          - script: terraform init -backend=false
            displayName: 'Terraform Init (shared)'
            workingDirectory: envs/shared

          - script: terraform validate
            displayName: 'Terraform Validate (shared)'
            workingDirectory: envs/shared

          - script: |
              set -e
              TFLINT_DIR=$(Agent.ToolsDirectory)/tflint/$(TFLINT_VERSION)
              mkdir -p "$TFLINT_DIR"
              curl -sSL -o /tmp/tflint.zip https://github.com/terraform-linters/tflint/releases/download/v$(TFLINT_VERSION)/tflint_linux_amd64.zip
              unzip -o -q /tmp/tflint.zip -d "$TFLINT_DIR"
              chmod +x "$TFLINT_DIR/tflint"
              echo "##vso[task.prependpath]$TFLINT_DIR"
            displayName: 'Install TFLint $(TFLINT_VERSION)'

          - script: tflint --recursive --minimum-failure-severity=error
            displayName: 'TFLint'

          - script: |
              set -e
              python3 -m pip install --user --break-system-packages "checkov==$(CHECKOV_VERSION)"
              echo "##vso[task.prependpath]$HOME/.local/bin"
            displayName: 'Install Checkov $(CHECKOV_VERSION)'
            # --break-system-packages overrides Debian/Ubuntu's PEP 668 guard;
            # --user still confines the install to the user site-packages,
            # not the OS's apt-managed dist-packages, so this doesn't touch
            # anything apt owns.

          # Advisory full-ruleset scan (checkov -d . --compact --quiet) is
          # temporarily skipped, mirroring homelab-application - it would
          # surface pre-existing findings across the repo that predate this
          # check and haven't been triaged. The blocking gate below is
          # unaffected.

          - script: checkov -d . --check CKV_AWS_40,CKV_AWS_1 --compact --quiet
            displayName: 'Checkov Scan (blocking)'
            # no continueOnError - hard-fails on: CKV_AWS_40 (IAM policy
            # attached to user), CKV_AWS_1 (S3 bucket policy allows public
            # access). CKV_AWS_62/63/355 (wildcard IAM action/resource) are
            # deliberately NOT in this list, even though they're conceptually
            # part of this gate - they're permanently skip-checked in
            # .checkov.yaml for modules/ado_agent's intentional instance-role
            # wildcards, and Checkov's CLI hard-errors ("--check and
            # --skip-check must be mutually exclusive") if a check ID appears
            # in both at once.

          - script: |
              set -e
              mkdir -p $(Build.ArtifactStagingDirectory)/terraform-checks-summary
              cat > $(Build.ArtifactStagingDirectory)/terraform-checks-summary/summary.json <<EOF
              {
                "status": "passed",
                "commit": "$(Build.SourceVersion)",
                "branch": "$(Build.SourceBranchName)",
                "buildId": "$(Build.BuildId)",
                "checkedAt": "$(System.PipelineStartTime)",
                "terraformVersion": "$(TERRAFORM_VERSION)",
                "tflintVersion": "$(TFLINT_VERSION)",
                "checkovVersion": "$(CHECKOV_VERSION)",
                "blockingChecks": ["CKV_AWS_40", "CKV_AWS_1"]
              }
              EOF
            displayName: 'Write Checks Summary'

          - publish: $(Build.ArtifactStagingDirectory)/terraform-checks-summary
            artifact: terraform-checks-summary
            displayName: 'Publish Checks Summary'

  - template: /templates/env-deploy.yml
    parameters:
      envName: Dev
      envDir: dev
      environmentName: dev-deployment
      dependsOn: Validate

  - template: /templates/env-deploy.yml
    parameters:
      envName: Prod
      envDir: prod
      environmentName: prod-deployment
      dependsOn: DevApply # sequential - Prod does not even plan until Dev has fully applied

  - template: /templates/env-deploy.yml
    parameters:
      envName: Shared
      envDir: shared
      environmentName: shared-deployment
      dependsOn: Validate # independent of Dev/Prod - shared provisions the very agent this pipeline runs on, so it can't sit in the app-facing dev->prod chain; it only waits on this pipeline's own Validate stage
