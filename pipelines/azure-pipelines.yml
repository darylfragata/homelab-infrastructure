trigger:
  branches:
    include:
      - develop

pool:
  name: AWS-Agents # self-hosted agent pool (matches azp_pool in tfvars)

stages:
  - stage: DevPlan
    displayName: "Plan (dev)"
    dependsOn: [] # explicit - no dependency, runs automatically on every trigger
    jobs:
      - job: DevPlan
        displayName: "Plan (dev)"
        steps:
          - template: /templates/terraform-plan-steps.yml
            parameters:
              envDir: dev

  - stage: DevApply
    displayName: "Apply (dev)"
    dependsOn: DevPlan
    jobs:
      - deployment: DevApply
        displayName: "Apply (dev)"
        environment: dev-deployment # ADO Environment - approval gate configured in Library UI, not here
        strategy:
          runOnce:
            deploy:
              steps:
                - template: /templates/terraform-apply-steps.yml
                  parameters:
                    envDir: dev

  - stage: ProdPlan
    displayName: "Plan (prod)"
    dependsOn: [] # explicit - fully independent, no dependency on Dev at all
    jobs:
      - job: ProdPlan
        displayName: "Plan (prod)"
        steps:
          - template: /templates/terraform-plan-steps.yml
            parameters:
              envDir: prod

  - stage: ProdApply
    displayName: "Apply (prod)"
    dependsOn: ProdPlan
    jobs:
      - deployment: ProdApply
        displayName: "Apply (prod)"
        environment: prod-deployment # ADO Environment - approval gate configured in Library UI, not here
        strategy:
          runOnce:
            deploy:
              steps:
                - template: /templates/terraform-apply-steps.yml
                  parameters:
                    envDir: prod
