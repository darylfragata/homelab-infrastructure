trigger: none
pr: none

pool:
  name: AWS-Agents # self-hosted agent pool

stages:
  - stage: CheckForChanges
    displayName: "Check for tfvars changes"
    jobs:
      - job: CheckForChanges
        displayName: "Check for tfvars changes"
        steps:
          - script: |
              set -e
              mkdir -p /home/ubuntu/tfvars
              MANIFEST_FILE=/home/ubuntu/tfvars/.bucket-manifest
              touch "$MANIFEST_FILE"

              aws s3api list-objects-v2 --bucket df-iac-tfvars --query "Contents[].[Key,ETag]" --output text | sort > /tmp/new-manifest.txt
              cp "$MANIFEST_FILE" /tmp/old-manifest.txt

              declare -A OLD_ETAG NEW_ETAG
              while read -r key etag; do [ -n "$key" ] && OLD_ETAG["$key"]="$etag"; done < /tmp/old-manifest.txt
              while read -r key etag; do [ -n "$key" ] && NEW_ETAG["$key"]="$etag"; done < /tmp/new-manifest.txt

              HAS_CHANGES=false

              for key in "${!NEW_ETAG[@]}"; do
                if [ -z "${OLD_ETAG[$key]+x}" ]; then
                  echo "Added:    $key"
                  HAS_CHANGES=true
                elif [ "${OLD_ETAG[$key]}" != "${NEW_ETAG[$key]}" ]; then
                  echo "Modified: $key"
                  HAS_CHANGES=true
                fi
              done

              for key in "${!OLD_ETAG[@]}"; do
                if [ -z "${NEW_ETAG[$key]+x}" ]; then
                  echo "Removed:  $key"
                  HAS_CHANGES=true
                fi
              done

              if [ "$HAS_CHANGES" = true ]; then
                echo "##vso[task.setvariable variable=hasChanges;isOutput=true]true"
              else
                echo "No tfvars files changed since the last sync - nothing to approve."
                echo "##vso[task.setvariable variable=hasChanges;isOutput=true]false"
              fi
            name: checkChanges
            displayName: "Diff bucket manifest against last sync"

  - stage: BucketSync
    displayName: "Sync tfvars bucket"
    dependsOn: CheckForChanges
    condition: eq(dependencies.CheckForChanges.outputs['CheckForChanges.checkChanges.hasChanges'], 'true')
    jobs:
      - deployment: BucketSync
        displayName: "Sync tfvars bucket to agent"
        environment: tfvars-deployment # ADO Environment - approval gate configured in Library UI, not here
        strategy:
          runOnce:
            deploy:
              steps:
                - template: /templates/tfvars-sync.yml

                - script: |
                    set -e
                    aws s3api list-objects-v2 --bucket df-iac-tfvars --query "Contents[].[Key,ETag]" --output text | sort > /home/ubuntu/tfvars/.bucket-manifest
                  displayName: "Record synced manifest"
