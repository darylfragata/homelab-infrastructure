trigger: none
pr: none

pool:
  name: AWS-Agents # self-hosted agent pool

stages:
  - stage: CheckForChanges
    displayName: "Check for tfvars changes"
    jobs:
      - job: CheckForChanges
        displayName: "Check for tfvars changes"
        steps:
          - script: |
              set -e
              NEW_CHECKSUM=$(aws s3api list-objects-v2 --bucket df-iac-tfvars --query "Contents[].[Key,ETag]" --output text | sort | sha256sum | awk '{print $1}')
              CHECKSUM_FILE=/home/ubuntu/tfvars/.bucket-checksum
              OLD_CHECKSUM=""
              if [ -f "$CHECKSUM_FILE" ]; then
                OLD_CHECKSUM=$(cat "$CHECKSUM_FILE")
              fi
              echo "Stored checksum: ${OLD_CHECKSUM:-<none>}"
              echo "Bucket checksum: $NEW_CHECKSUM"
              if [ "$NEW_CHECKSUM" != "$OLD_CHECKSUM" ]; then
                echo "tfvars bucket has changed since the last sync."
                echo "##vso[task.setvariable variable=hasChanges;isOutput=true]true"
              else
                echo "No change since the last sync - nothing to approve."
                echo "##vso[task.setvariable variable=hasChanges;isOutput=true]false"
              fi
            name: checkChanges
            displayName: "Compare bucket checksum to last sync"

  - stage: BucketSync
    displayName: "Sync tfvars bucket"
    dependsOn: CheckForChanges
    condition: eq(dependencies.CheckForChanges.outputs['CheckForChanges.checkChanges.hasChanges'], 'true')
    jobs:
      - deployment: BucketSync
        displayName: "Sync tfvars bucket to agent"
        environment: tfvars-deployment # ADO Environment - approval gate configured in Library UI, not here
        strategy:
          runOnce:
            deploy:
              steps:
                - template: /templates/tfvars-sync.yml

                - script: |
                    set -e
                    aws s3api list-objects-v2 --bucket df-iac-tfvars --query "Contents[].[Key,ETag]" --output text | sort | sha256sum | awk '{print $1}' > /home/ubuntu/tfvars/.bucket-checksum
                  displayName: "Record synced checksum"
