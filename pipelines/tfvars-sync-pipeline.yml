trigger: none
pr: none

pool:
  name: AWS-Agents # self-hosted agent pool

stages:
  - stage: DevBucketSync
    displayName: "Sync tfvars (dev)"
    dependsOn: [] # explicit - no dependency, runs automatically on every trigger
    jobs:
      - deployment: DevBucketSync
        displayName: "Sync tfvars bucket to agent"
        environment: dev-deployment # ADO Environment - approval gate configured in Library UI, not here
        strategy:
          runOnce:
            deploy:
              steps:
                - template: /templates/tfvars-sync.yml

  - stage: ProdBucketSync
    displayName: "Sync tfvars (prod)"
    dependsOn: [] # explicit - no dependency, runs automatically on every trigger
    jobs:
      - deployment: ProdBucketSync
        displayName: "Sync tfvars bucket to agent"
        environment: prod-deployment # ADO Environment - approval gate configured in Library UI, not here
        strategy:
          runOnce:
            deploy:
              steps:
                - template: /templates/tfvars-sync.yml

  - stage: SharedBucketSync
    displayName: "Sync tfvars (shared)"
    dependsOn: [] # explicit - no dependency, runs automatically on every trigger
    jobs:
      - deployment: SharedBucketSync
        displayName: "Sync tfvars bucket to agent"
        environment: shared-deployment # ADO Environment - approval gate configured in Library UI, not here
        strategy:
          runOnce:
            deploy:
              steps:
                - template: /templates/tfvars-sync.yml
